<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile CCTV Camera Broadcaster — Pune Police</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 16px; text-align: center; }
        .header { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(0,242,254,0.3); }
        .header h2 { font-size: 1.1rem; color: #00f2fe; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .video-box { flex: 1; margin: 16px 0; position: relative; background: #000; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .alert-overlay { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(255,0,85,0.9); padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { background: #00f2fe; color: #0f172a; border: none; padding: 14px 20px; font-weight: 800; border-radius: 10px; font-size: 0.95rem; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-danger { background: #ff0055; color: #fff; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fa-solid fa-mobile-screen-button"></i> PUNE POLICE MOBILE CCTV BROADCASTER</h2>
        <p style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">Streaming live camera frames to Command Center HQ</p>
    </div>

    <div class="video-box">
        <video id="webcam-video" autoplay playsinline muted></video>
        <div id="alert-box" class="alert-overlay" style="display:none;">
            🚨 WANTED CRIMINAL DETECTED ON PHONE CAMERA!
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="btn-toggle-cam"><i class="fa-solid fa-camera-rotate"></i> Flip Camera</button>
        <button class="btn btn-danger" id="btn-stop"><i class="fa-solid fa-stop"></i> Stop Stream</button>
    </div>

    <canvas id="canvas-capture"></canvas>

    <script>
        let currentStream = null;
        let useFacingMode = 'environment'; // Rear camera by default
        let isBroadcasting = true;

        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('canvas-capture');
        const alertBox = document.getElementById('alert-box');
        const toggleBtn = document.getElementById('btn-toggle-cam');
        const stopBtn = document.getElementById('btn-stop');

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFacingMode },
                    audio: false
                });
                video.srcObject = currentStream;
                video.play();
            } catch (e) {
                alert("Camera Access Error: " + e.message);
            }
        }

        async function sendFrameToHQ() {
            if (!isBroadcasting || !video.videoWidth) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const formData = new FormData();
                formData.append('image', blob);

                try {
                    const res = await fetch('/api/cctv/mobile_frame', {
                        method: 'POST',
                        body: formData
                    });
                    const json = await res.json();
                    if (json.status === 'success' && json.data && json.data.threat_detected) {
                        alertBox.style.display = 'block';
                        alertBox.textContent = `🚨 WANTED MATCH: ${json.data.top_match.full_name} (${json.data.top_match.match_confidence}%)`;
                    } else {
                        alertBox.style.display = 'none';
                    }
                } catch (e) {
                    console.error("Frame stream error:", e);
                }
            }, 'image/jpeg', 0.7);
        }

        toggleBtn.addEventListener('click', () => {
            useFacingMode = useFacingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        stopBtn.addEventListener('click', () => {
            isBroadcasting = !isBroadcasting;
            if (isBroadcasting) {
                startCamera();
                stopBtn.textContent = "Stop Stream";
                stopBtn.className = "btn btn-danger";
            } else {
                if (currentStream) currentStream.getTracks().forEach(t => t.stop());
                stopBtn.textContent = "Start Stream";
                stopBtn.className = "btn";
            }
        });

        startCamera();
        setInterval(sendFrameToHQ, 1000); // Stream 1 frame per second
    </script>
</body>
</html>
